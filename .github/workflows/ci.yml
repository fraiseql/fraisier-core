name: CI

# The gate is defined once, in `crates/xtask`. This workflow runs the exact same
# command a developer runs locally — `cargo xtask ci` — so local and CI never drift.
on:
  push:
    branches: [main, phase-02]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Installs the channel + clippy/rustfmt components pinned in rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2
        with:
          tool: cargo-deny

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # The exit-code contract test diffs `exit_codes.vendored.json` against what confiture
      # itself emits, and fails rather than skips when confiture is missing or is not the
      # pinned release. The gate installs that release — exact and transitive, on confiture's
      # own 3.11 floor — so the contract is measured against a named version rather than
      # against whatever PyPI serves today.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # `confiture` goes on PATH rather than into `FRAISIER_CONFITURE_BIN`, and alone in its
      # own directory so the venv's `python` does not shadow the runner's: the approval
      # hook test asserts on the whole inherited `FRAISIER_*` set, so any such variable in
      # the gate's environment reddens seven unrelated tests (fraiseql/fraisier-core#64).
      - name: Install the pinned confiture
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/confiture"
          uv pip install --python "$RUNNER_TEMP/confiture/bin/python" \
            -r tools/confiture-requirements.txt
          mkdir -p "$RUNNER_TEMP/confiture-bin"
          ln -s "$RUNNER_TEMP/confiture/bin/confiture" "$RUNNER_TEMP/confiture-bin/confiture"
          echo "$RUNNER_TEMP/confiture-bin" >>"$GITHUB_PATH"

      - name: Run the gate
        run: cargo xtask ci
