name: release-binaries

# release-plz publishes `fraisier` to crates.io and cuts the GitHub release, but it
# builds NO binaries — so the only way to get a `fraisier` binary was
# `cargo install fraisier`, which bakes in the build host's glibc floor. Built on a
# modern host that is `GLIBC_2.38`+, which is why the beta.4 binary failed to load on
# Debian 12 (glibc 2.36).
#
# This workflow attaches portable, prebuilt `fraisier` binaries to each `fraisier-v*`
# release: the Linux `-gnu` builds are glibc-floored to 2.28 with cargo-zigbuild (run
# on Debian 10+/Ubuntu 18.04+/RHEL 8+), plus a fully-static musl build for
# Alpine/distroless/scratch. A release-time objdump gate fails the build if any Linux
# `-gnu` binary would need newer than GLIBC_2.34.
#
# Triggered on `release: published` (not the tag push) so the release always exists
# when we upload — release-plz creates it via a GitHub App token, so the event does
# fire this workflow. Only the `fraisier` bin crate's tags qualify (fraisier-webhook-v*
# and other workspace crates are filtered out).
#
# Each target also gets a CycloneDX SBOM (`fraisier-<target>.cdx.json`), and a final
# job writes `SHA256SUMS` over every tarball and SBOM once all targets have uploaded.
# If any target fails, `SHA256SUMS` is not written, so a release never carries a
# checksum file that silently omits a binary.

on:
  release:
    types: [published]

permissions:
  contents: write   # upload assets to the release

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols   # strip at link time (host-arch-independent)

jobs:
  binaries:
    name: ${{ matrix.target }}
    if: >-
      github.repository == 'fraiseql/fraisier-core' &&
      startsWith(github.event.release.tag_name, 'fraisier-v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.28
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig_target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # cargo-zigbuild pins the glibc floor (`.2.28`) via zig as the linker and
      # produces static musl binaries. Only the Linux `zig_target` rows use it; the
      # macOS rows build natively.
      - name: Install zig + cargo-zigbuild
        if: matrix.zig_target
        shell: bash
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | tar -xJ
          echo "$PWD/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Build fraisier
        shell: bash
        run: |
          if [ -n "${{ matrix.zig_target }}" ]; then
            cargo zigbuild --release --target "${{ matrix.zig_target }}" --bin fraisier
          else
            cargo build --release --target "${{ matrix.target }}" --bin fraisier
          fi

      - name: Verify glibc ceiling (Linux gnu)
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: bash
        run: |
          ceiling="2.34"
          p="target/${{ matrix.target }}/release/fraisier"
          max=$(objdump -T "$p" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "fraisier needs up to GLIBC_${max:-none}"
          if [ -n "$max" ] && [ "$(printf '%s\n%s\n' "$ceiling" "$max" | sort -V | tail -1)" != "$ceiling" ]; then
            echo "::error::fraisier requires GLIBC_$max > $ceiling — would not load on Debian 12 (glibc 2.36)"
            exit 1
          fi

      - name: Package
        shell: bash
        run: tar czf "fraisier-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" fraisier

      # The SBOM describes the dependency graph resolved for this target with the
      # default features, which is what `--bin fraisier` above builds. cargo-cyclonedx
      # writes one file per workspace member; only the `fraisier` crate's is shipped.
      - name: SBOM (CycloneDX)
        shell: bash
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --target "${{ matrix.target }}" --no-build-deps --format json \
            --spec-version 1.5 --override-filename "fraisier-${{ matrix.target }}.cdx"
          mv "crates/fraisier-cli/fraisier-${{ matrix.target }}.cdx.json" .

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            "fraisier-${{ matrix.target }}.tar.gz" "fraisier-${{ matrix.target }}.cdx.json"

  checksums:
    name: SHA256SUMS
    needs: binaries
    if: >-
      github.repository == 'fraiseql/fraisier-core' &&
      startsWith(github.event.release.tag_name, 'fraisier-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Hashes what the release actually serves, downloaded back, rather than the
      # build jobs' local files: a checksum must describe the published bytes.
      - name: Download every tarball and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern 'fraisier-*.tar.gz' --pattern 'fraisier-*.cdx.json'

      - name: Write SHA256SUMS
        shell: bash
        run: |
          expected=10   # five targets, a tarball and an SBOM each
          shopt -s nullglob
          files=(fraisier-*.tar.gz fraisier-*.cdx.json)
          if [ "${#files[@]}" -ne "$expected" ]; then
            echo "::error::expected $expected release files, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" --repo "${{ github.repository }}" --clobber SHA256SUMS
