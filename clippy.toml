# Domain nouns that look like code to `doc_markdown` but are plain prose here.
# The trailing ".." keeps clippy's built-in defaults (OpenGL, OpenSSL, …).
doc-valid-idents = [
    "OTel",
    "OTLP",
    "OpenTelemetry",
    "SpecQL",
    "FraiseQL",
    "PostgreSQL",
    "pg_tviews",
    "SQLite",
    "JSON-RPC",
    "GitHub",
    "OAuth2",
    "..",
]
