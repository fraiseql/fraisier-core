[package]
name = "fraisier-adapter-command"
description = "Universal escape-hatch command adapters for fraisier: a migration adapter and a health gate that run configured shell commands behind the frozen traits."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
fraisier-core = { path = "../fraisier-core", version = "1.0.0-beta.4" }
fraisier-adapter-support = { path = "../fraisier-adapter-support", version = "1.0.0-beta.4" }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync"] }
