[package]
name = "fraisier-artifact-pull"
description = "Host-pull ArtifactAdapter for fraisier: each host fetches and activates its own release via curl/sha256sum/ln over the transport (local or ssh) — the simple-Linux-fleet strategy."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
fraisier-core = { path = "../fraisier-core", version = "1.0.0-beta.4" }
fraisier-adapter-support = { path = "../fraisier-adapter-support", version = "1.0.0-beta.4" }
serde_json = "1.0.150"

[dev-dependencies]
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
