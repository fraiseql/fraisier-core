[package]
name = "fraisier-artifact-release"
description = "Release-artifact adapter for fraisier: download + sha256-verify + stage + activate behind the ArtifactAdapter trait."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
fraisier-core = { path = "../fraisier-core", version = "1.0.0-beta.8" }
fraisier-adapter-support = { path = "../fraisier-adapter-support", version = "1.0.0-beta.8" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
