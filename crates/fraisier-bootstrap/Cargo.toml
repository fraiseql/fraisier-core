[package]
name = "fraisier-bootstrap"
description = "SSH-based host bootstrap for fraisier: prepare a host's filesystem (deploy directories) over the same Local|Ssh transport the deploy uses."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fraisier-core = { path = "../fraisier-core", version = "1.0.0-beta.8" }
fraisier-adapter-support = { path = "../fraisier-adapter-support", version = "1.0.0-beta.8" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
