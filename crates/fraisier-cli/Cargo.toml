[package]
name = "fraisier-cli"
description = "The fraisier command-line binary: deploy, validate-config, status, and adapter discovery over the in-process and IPC adapter paths."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[[bin]]
name = "fraisier"
path = "src/main.rs"

[features]
default = []
# Export saga spans over OTLP/HTTP (Jaeger, etc.). Off by default so the stock
# binary stays lean; the PRD §10.3 checkpoint builds with it. Enables the
# export pipeline in fraisier-saga and is initialised in `main` when an OTLP
# endpoint is configured in the environment.
otel = ["fraisier-saga/otel"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

# Vocabulary, engine, config, and the IPC transport. Per the crate-graph rule the
# CLI is the layer that depends on *both* fraisier-core and fraisier-ipc and wires
# in-process vs IPC adapter selection.
fraisier-core = { path = "../fraisier-core", version = "1.0.0-alpha.1" }
fraisier-config = { path = "../fraisier-config", version = "1.0.0-alpha.1" }
fraisier-saga = { path = "../fraisier-saga", version = "1.0.0-alpha.1" }
fraisier-ipc = { path = "../fraisier-ipc", version = "1.0.0-alpha.1" }

# In-process adapters selected by name from the config.
fraisier-adapter-support = { path = "../fraisier-adapter-support", version = "1.0.0-alpha.1" }
fraisier-adapter-confiture = { path = "../fraisier-adapter-confiture", version = "1.0.0-alpha.1" }
fraisier-adapter-command = { path = "../fraisier-adapter-command", version = "1.0.0-alpha.1" }
fraisier-adapter-systemd = { path = "../fraisier-adapter-systemd", version = "1.0.0-alpha.1" }
fraisier-adapter-rc = { path = "../fraisier-adapter-rc", version = "1.0.0-alpha.1" }
fraisier-adapter-docker-compose = { path = "../fraisier-adapter-docker-compose", version = "1.0.0-alpha.1" }
fraisier-adapter-http = { path = "../fraisier-adapter-http", version = "1.0.0-alpha.1" }
fraisier-adapter-nginx = { path = "../fraisier-adapter-nginx", version = "1.0.0-alpha.1" }
fraisier-artifact-release = { path = "../fraisier-artifact-release", version = "1.0.0-alpha.1" }
fraisier-artifact-pull = { path = "../fraisier-artifact-pull", version = "1.0.0-alpha.1" }

# On-disk file generators (the `init` starter config; `scaffold` templates).
fraisier-scaffold = { path = "../fraisier-scaffold", version = "1.0.0-alpha.1" }

[dev-dependencies]
tempfile = "3.27.0"
