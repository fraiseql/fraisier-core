[package]
name = "fraisier-core"
description = "Deploy-specific composition over the fraisier-saga engine: the five adapter axes (artifact, migration, service, health, load-balancer) and the multi-host plan."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
fraisier-saga = { path = "../fraisier-saga", version = "1.0.0-alpha.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
