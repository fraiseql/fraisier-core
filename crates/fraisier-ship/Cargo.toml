[package]
name = "fraisier-ship"
description = "Version reading/bumping (Cargo.toml + pyproject.toml) and the `ship` release workflow for the fraisier CLI."
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Edit version fields in place, preserving the file's formatting and comments.
toml_edit = "0.22.22"
# Parse and increment semantic versions.
semver = "1.0.23"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.27.0"
