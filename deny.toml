# cargo-deny configuration — supply-chain, license, and advisory gate.
#
#   cargo deny check
#
# See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Check every dependency against the RustSec advisory database. A new advisory
# failing CI is a signal to upgrade, not to suppress: an entry below is allowed only
# when no upgrade exists yet, and carries the date to check again.
ignore = [
    # The SQLite that libsqlite3-sys < 0.39 bundles. sqlx-sqlite 0.9.0, the latest,
    # caps libsqlite3-sys at < 0.38, so no upgrade exists. Only the opt-in
    # `fraisier-saga/sqlite` state store links it; the released `fraisier` binary
    # (default features, and `otel`) does not. Remove this entry once sqlx accepts
    # libsqlite3-sys >= 0.39 (`cargo update -p libsqlite3-sys`).
    # Re-check by 2026-12-11.
    { id = "RUSTSEC-2026-0459", reason = "no upgrade until sqlx accepts libsqlite3-sys >= 0.39; opt-in sqlite feature only; re-check by 2026-12-11" },
]

[licenses]
# Only permissive licenses compatible with redistributing under `MIT OR
# Apache-2.0`. Anything outside this set fails the check and must be reviewed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are tolerated: sqlx / tokio / opentelemetry pull
# overlapping sub-crate versions that are outside this workspace's control.
multiple-versions = "allow"
# A wildcard (`*`) version requirement is a release-hygiene hazard.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
