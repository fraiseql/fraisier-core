[toolchain]
# Pinned to an exact release so a new stable cannot turn an untouched tree red.
# The workspace `rust-version` is this pin's X.Y (the MSRV is the version the gate
# builds with); `cargo xtask toolchain` enforces both. To bump: change both in one
# PR that also carries any new lint fixes, and run `cargo xtask ci`.
channel = "1.99.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
