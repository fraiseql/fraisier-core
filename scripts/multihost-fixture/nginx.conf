# The fixture LB config. fraisier's nginx LB adapter edits the `server` lines in
# `upstream fixture_upstream { … }` (toggling the `down` flag on drain/reattach)
# and reloads nginx. nginx runs on the host network, so 127.0.0.x are the app
# hosts' published ports.
events {}

http {
    upstream fixture_upstream {
        server 127.0.0.2:8080;
        server 127.0.0.3:8080;
        server 127.0.0.4:8080;
    }

    server {
        listen 8090;
        location / {
            proxy_pass http://fixture_upstream;
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_500;
        }
    }
}
